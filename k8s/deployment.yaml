apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-compute-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-compute-layer
  template:
    metadata:
      labels:
        app: secure-compute-layer
    spec:
      serviceAccountName: secure-app-sa
      # Pod-level Security Context (fixes KSV-0118, KSV-0030, KSV-0104)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: secure-processor
          # Updated with your real Docker Hub image (fixes KSV-0125)
          image: sun003/secure-backend:v1.0
          ports:
            - containerPort: 8080
          # Container-level Security Context
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Resource Limits and Requests (fixes KSV-0011, KSV-0015, KSV-0016, KSV-0018)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: secure-compute-service
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: secure-compute-layer